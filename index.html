<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMF — Center of Mathematical Finance</title>
  <link rel="icon" type="image/png" href="assets/cmf-logo-white.png" />

  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <!-- build:csp -->
  <!-- Dev policy: permissive because Babel transpiles in-browser ('unsafe-eval')
       and React is fetched from unpkg. build.sh replaces this block with a
       strict production policy that allows neither. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" />
  <!-- /build:csp -->

  <!-- Fonts: Space Grotesk (display), Geist (body), JetBrains Mono (mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- KaTeX for real math typography -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>

  <!-- build:css -->
  <link rel="stylesheet" href="styles.css" />
  <!-- /build:css -->
</head>
<body>
  <div id="app"></div>

  <!-- build:js -->
  <!-- Dev only: React + Babel from CDN, JSX transpiled in-browser.
       ./build.sh replaces this whole block with a single bundled, minified
       script. Open this file directly for local dev — no install needed. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- App components -->
  <script type="text/babel" src="content.js"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="admin.jsx"></script>
  <script type="text/babel" src="landing.jsx"></script>
  <script type="text/babel" src="program.jsx"></script>
  <script type="text/babel" src="project.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <!-- /build:js -->
</body>
</html>
