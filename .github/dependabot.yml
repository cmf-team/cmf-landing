version: 2
updates:
  # Actions are pinned to commit SHAs in the workflows, which is safe but goes
  # stale silently. Dependabot bumps the SHAs (and the # vN comment) for us.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for routine bumps rather than three.
      all-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
