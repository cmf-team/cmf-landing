# Deploy configuration for cmf-landing.
# Sourced by ./deploy.sh and ./build.sh.

# The public address of the site.
#
#   empty  -> https://cmf-team.github.io/cmf-landing/   (default, works today)
#   set    -> https://<CUSTOM_DOMAIN>/                  (run ./deploy.sh --domain-setup once)
#
# Apex and subdomain are both fine; the script detects which and prints the
# matching DNS records.
#
#   CUSTOM_DOMAIN="cmf.org"       # apex      -> 4 A records (+4 AAAA)
#   CUSTOM_DOMAIN="www.cmf.org"   # subdomain -> 1 CNAME record
#
CUSTOM_DOMAIN=""

# GitHub repository as owner/name. Left empty, it is derived from `git remote`.
REPO=""
