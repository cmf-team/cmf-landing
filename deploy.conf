# Deploy configuration for cmf-landing.
# Sourced by ./deploy.sh and ./build.sh.

# The public address of the site.
#
#   empty  -> https://cmf-team.github.io/cmf-landing/   (default, works today)
#   set    -> https://<CUSTOM_DOMAIN>/                  (run ./deploy.sh --domain-setup once)
#
# Apex and subdomain are both fine; the script detects which and prints the
# matching DNS records.
#
#   CUSTOM_DOMAIN="cmf.org"       # apex      -> 4 A records (+4 AAAA)
#   CUSTOM_DOMAIN="www.cmf.org"   # subdomain -> 1 CNAME record
#
#
# The apex, ynvrsty.com, is a different site in a different repository
# (cmf-team/ynvrsty-home). A Pages repo can only claim one domain, which is why
# they are split. build.sh writes this value into dist/CNAME, and that file is
# what actually assigns the domain — so changing this line and deploying is the
# whole move.
CUSTOM_DOMAIN="cmf.ynvrsty.com"

# GitHub repository as owner/name. Left empty, it is derived from `git remote`.
REPO=""

# URL of the CMS OAuth broker Worker (see docs/cms-setup.md).
# Empty means the CMS ships but cannot log in.
#   OAUTH_BROKER="https://sveltia-cms-auth.<subdomain>.workers.dev"
OAUTH_BROKER="https://sveltia-cms-auth.nik-schelkanov.workers.dev"
