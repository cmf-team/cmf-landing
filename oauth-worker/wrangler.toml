name = "cmf-cms-oauth"
main = "worker.js"
compatibility_date = "2026-07-26"

[vars]
# The only origin the broker will hand a token to.
ALLOWED_ORIGIN = "https://ynvrsty.com"

# GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET are secrets, NOT vars.
# Set them with:
#   npx wrangler secret put GITHUB_CLIENT_ID
#   npx wrangler secret put GITHUB_CLIENT_SECRET
# Never put them in this file — it is committed to a public repo.
