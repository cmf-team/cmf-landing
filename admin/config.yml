# CMS configuration — edited content is committed to content.json as a PR.
#
# base_url points at the OAuth broker (a Cloudflare Worker). It exists only to
# exchange the GitHub OAuth code for a token, because GitHub's token endpoint
# refuses browser requests via CORS. The client secret lives in the Worker; no
# credential is ever shipped to the browser.
backend:
  name: github
  repo: cmf-team/cmf-landing
  branch: master
  base_url: __OAUTH_BROKER_URL__
  auth_endpoint: auth
  commit_messages:
    create: 'content: create {{collection}} "{{slug}}"'
    update: 'content: update {{collection}} "{{slug}}"'
    delete: 'content: delete {{collection}} "{{slug}}"'
    uploadMedia: 'content: upload {{path}}'
    deleteMedia: 'content: delete {{path}}'

# Every change opens a pull request instead of committing to master directly.
publish_mode: editorial_workflow

# Must live under assets/, because that is the only directory build.sh copies
# into dist/ — uploads anywhere else would never be deployed.
media_folder: assets/uploads
public_folder: /assets/uploads

site_url: https://ynvrsty.com
display_url: https://ynvrsty.com

